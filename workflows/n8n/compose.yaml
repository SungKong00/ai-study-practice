name: ai-study-intake
services:
  n8n:
    image: n8nio/n8n:2.48.8@sha256:e0df076a41076127d5f765e05acb8ba746bddff86442a92269c0f5a7219a7e4b
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./exports:/workflows:ro
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: triage
      POSTGRES_DB: triage
      POSTGRES_PASSWORD: ${TRIAGE_DB_PASSWORD:?Set TRIAGE_DB_PASSWORD for the local intake database}
    volumes:
      - intake-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/10-intake.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  n8n-data:
  intake-data:
