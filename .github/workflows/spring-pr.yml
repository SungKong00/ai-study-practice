name: Spring PR
on: pull_request

permissions:
  contents: read

jobs:
  spring:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew test bootJar --console=plain
      - name: OpenSpec 및 요청 인계 검사
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          npm install --global @fission-ai/openspec@1.14.3
          scripts/check-harness "$BASE_SHA" HEAD
